<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>NovaSocial</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#E1306C">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;height:-webkit-fill-available}
body{height:100%;height:-webkit-fill-available;background:#000;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;position:fixed;width:100%}
*::-webkit-scrollbar{display:none}
input,textarea,button{font-family:inherit}
input::placeholder,textarea::placeholder{color:#444}

/* SPLASH */
#splash{position:fixed;inset:0;background:#000;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity 0.5s ease}
#splash.hide{opacity:0;pointer-events:none}
.splash-logo{font-size:48px;font-weight:900;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:splashPulse 1.3s ease-in-out infinite}
.splash-tag{color:#444;font-size:13px;letter-spacing:1.5px}
@keyframes splashPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:0.75}}

/* CORE LAYOUT */
#root{display:flex;flex-direction:column;height:100vh;height:-webkit-fill-available;width:100%;position:fixed;top:0;left:0;right:0;bottom:0}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
#nav{height:60px;min-height:60px;background:#000;border-top:1px solid #1a1a1a;display:flex;align-items:center;width:100%;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}

/* NAV BUTTONS */
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;cursor:pointer;position:relative;gap:3px;padding-bottom:4px}
.nb svg{transition:all 0.2s}
.nb .ndot{width:4px;height:4px;border-radius:50%;background:#fff;opacity:0;transition:opacity 0.2s}
.nb.on .ndot{opacity:1}

/* AUTH */
#auth{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:1000;overflow-y:auto}
.alogo{font-size:44px;font-weight:900;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.asub{color:#555;font-size:14px;margin-bottom:40px}
.atabs{display:flex;background:#111;border-radius:14px;padding:4px;width:100%;max-width:400px;margin-bottom:20px}
.atab{flex:1;padding:11px;text-align:center;border-radius:11px;cursor:pointer;font-weight:600;font-size:14px;transition:all 0.2s;color:#555}
.atab.on{background:#1a1a1a;color:#fff}
.aform{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
.inp{width:100%;background:#0f0f0f;border:1px solid #222;border-radius:14px;padding:15px 16px;color:#fff;font-size:15px;outline:none;transition:border 0.2s}
.inp:focus{border-color:#555}
.bgrd{background:linear-gradient(135deg,#833AB4,#E1306C,#F77737);border:none;border-radius:14px;color:#fff;font-weight:700;font-size:15px;cursor:pointer;padding:15px;width:100%;transition:opacity 0.2s}
.bgrd:active{opacity:0.8}
.bout{background:transparent;border:1px solid #2a2a2a;border-radius:14px;color:#fff;font-weight:600;font-size:14px;cursor:pointer;padding:13px;width:100%}
.aerr{color:#E1306C;font-size:13px;text-align:center;padding:4px}

/* TOPBAR */
.topbar{position:sticky;top:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:100;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #111}
.logo{font-size:24px;font-weight:900;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* CARDS */
.post{border-bottom:8px solid #0a0a0a}
.post-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 14px}
.post-media{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.post-acts{padding:10px 14px 8px}

/* AVATAR */
.av{border-radius:50%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.avring{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);padding:2px;border-radius:50%}
.avrinner{border:2px solid #000;border-radius:50%}
.onlinedot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:#3db83d;border:2px solid #000}

/* STORIES */
.sbar{overflow-x:auto;display:flex;gap:16px;padding:14px 16px;border-bottom:1px solid #0d0d0d}
.si{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;cursor:pointer}
.sname{font-size:11px;max-width:64px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#bbb}

/* MODAL */
.mbg{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,0.8);display:flex;flex-direction:column}
.msheet{background:#0d0d0d;border-radius:24px 24px 0 0;margin-top:auto;max-height:94vh;overflow-y:auto;animation:slideUp 0.3s cubic-bezier(0.32,0.72,0,1)}
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #1a1a1a;position:sticky;top:0;background:#0d0d0d;z-index:1}

/* STORY VIEWER */
#sv{position:fixed;inset:0;z-index:9000;background:#000;display:none;flex-direction:column}
#sv.show{display:flex}

/* LOADER */
.ldiv{display:flex;justify-content:center;align-items:center;padding:40px}
.spin{width:28px;height:28px;border-radius:50%;border:2px solid #222;border-top-color:#E1306C;animation:spin 0.7s linear infinite}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a1a1a;color:#fff;font-size:13px;padding:11px 24px;border-radius:24px;z-index:9999;white-space:nowrap;opacity:0;transition:all 0.3s;pointer-events:none;border:1px solid #2a2a2a;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* HEART POP */
.hpop{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;pointer-events:none;z-index:10;animation:heartPop 0.7s ease forwards}

/* REACTION BAR */
.reaction-bar{position:absolute;bottom:100%;left:0;margin-bottom:8px;background:#1a1a1a;border:1px solid #2e2e2e;border-radius:24px;padding:8px 12px;display:none;gap:9px;box-shadow:0 6px 24px rgba(0,0,0,0.55);z-index:60;white-space:nowrap;animation:fadeIn 0.15s ease}
.reaction-bar span{transition:transform 0.15s}
.reaction-bar span:active{transform:scale(1.4)}

/* EXPLORE */
.egrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.eitem{aspect-ratio:1/1;background:#111;overflow:hidden;cursor:pointer;position:relative}
.eitem img,.eitem video{width:100%;height:100%;object-fit:cover}

/* PROFILE */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pitem{aspect-ratio:1/1;background:#111;overflow:hidden;cursor:pointer}
.pitem img{width:100%;height:100%;object-fit:cover}
.pstat{text-align:center;flex:1}
.pstat-n{font-weight:800;font-size:20px;color:#fff}
.pstat-l{color:#777;font-size:12px}

/* MSG */
.clist{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #0d0d0d;cursor:pointer;transition:background 0.15s}
.clist:active{background:#0d0d0d}
.mme{background:linear-gradient(135deg,#833AB4,#E1306C);border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:72%;font-size:14px;line-height:1.5;margin-left:auto}
.mthem{background:#1a1a1a;border-radius:18px 18px 18px 4px;padding:10px 14px;max-width:72%;font-size:14px;line-height:1.5}

/* SEARCH */
.sbar2{display:flex;align-items:center;gap:10px;background:#111;border-radius:14px;padding:11px 14px;flex:1}
.sbar2 input{background:transparent;border:none;outline:none;color:#fff;font-size:14px;flex:1}

/* PILLS */
.pills{overflow-x:auto;display:flex;gap:8px;padding:12px 16px 0;scrollbar-width:none}
.pill{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s}

/* UPLOAD BAR */
.upbar{height:4px;background:#222;border-radius:4px;overflow:hidden}
.upfill{height:100%;background:linear-gradient(90deg,#833AB4,#E1306C,#F77737);border-radius:4px;transition:width 0.3s}

/* REEL */
.rvid{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.mute-btn{position:absolute;top:60px;right:14px;z-index:6;background:rgba(0,0,0,0.45);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* NOTIF */
.nitem{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #0d0d0d;cursor:pointer;transition:background 0.15s}
.nitem:active{background:#0d0d0d}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes heartPop{0%{transform:translate(-50%,-50%) scale(0);opacity:1}55%{transform:translate(-50%,-50%) scale(1.5)}100%{transform:translate(-50%,-50%) scale(1.2);opacity:0}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{animation:fadeIn 0.3s ease}
</style>
</head>

function av(url,name,size=36,ring=false,online=false){
  const l=(name||'?')[0].toUpperCase();
  const inner=url?`<img src="${url}" style="width:100%;height:100%;object-fit:cover">`:`<span style="font-size:${Math.round(size*0.42)}px;font-weight:700;line-height:1">${l}</span>`;
  let html;
  if(ring) html=`<div class="avring"><div class="avrinner"><div class="av" style="width:${size-5}px;height:${size-5}px">${inner}</div></div></div>`;
  else html=`<div class="av" style="width:${size}px;height:${size}px">${inner}</div>`;
  if(online) return `<div style="position:relative;flex-shrink:0">${html}<div class="onlinedot"></div></div>`;
  return html;
}

function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'k':String(n||0)}
function ago(ts){const s=Math.floor((Date.now()-new Date(ts))/1000);if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';}
function isOnline(ts){if(!ts)return false;return (Date.now()-new Date(ts).getTime())<5*60*1000;}

let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2500);}

function setMode(m){
  amode=m;
  document.getElementById('at-login').className='atab'+(m==='login'?' on':'');
  document.getElementById('at-signup').className='atab'+(m==='signup'?' on':'');
  document.getElementById('sf').style.display=m==='signup'?'flex':'none';
  document.getElementById('abtn').textContent=m==='login'?'Log In':'Create Account';
  document.getElementById('aswt').textContent=m==='login'?'Naya account? ':'Already account hai? ';
  document.getElementById('aswl').textContent=m==='login'?'Sign Up':'Log In';
  document.getElementById('aerr').style.display='none';
}

async function doAuth(){
  const email=document.getElementById('i-email').value.trim();
  const pass=document.getElementById('i-pass').value;
  const err=document.getElementById('aerr');
  const btn=document.getElementById('abtn');
  if(!email||!pass){showErr('Email aur password daalo');return;}
  btn.textContent='Please wait...';btn.disabled=true;err.style.display='none';
  try{
    if(amode==='login'){
      const{error}=await db.auth.signInWithPassword({email,password:pass});
      if(error) showErr(error.message.includes('Invalid')?'Email ya password galat hai':error.message);
    }else{
      const uname=document.getElementById('i-user').value.trim().toLowerCase().replace(/\s/g,'_');
      const fname=document.getElementById('i-name').value.trim();
      if(!uname){showErr('Username daalo');btn.textContent='Create Account';btn.disabled=false;return;}
      const{data,error}=await db.auth.signUp({email,password:pass,options:{data:{username:uname,full_name:fname}}});
      if(error) showErr(error.message);
      else if(data.user&&!data.session) showErr('✅ Email bheja! Verify karo phir login karo.');
    }
  }catch(e){showErr('Network error. Internet check karo.');}
  btn.textContent=amode==='login'?'Log In':'Create Account';btn.disabled=false;
}
function showErr(m){const e=document.getElementById('aerr');e.textContent=m;e.style.display='block';}

function updateNavIcons(tab){
  const navEl=document.getElementById('nav');
  const btns=navEl.querySelectorAll('.nb');
  btns.forEach(b=>{
    const t=b.dataset.t;
    const on=t===tab;
    const svg=b.querySelector('svg');
    if(svg){
      if(t==='home'){svg.setAttribute('fill',on?'#fff':'none');svg.setAttribute('stroke',on?'none':'#555');}
      else{svg.setAttribute('stroke',on?'#fff':'#555');const poly=svg.querySelector('polygon');if(poly)poly.setAttribute('fill',on?'#fff':'#555');}
    }
    const navav=b.querySelector('#nav-av');
    if(navav) navav.style.borderColor=on?'#fff':'#555';
  });
}

// ── UPLOAD ──────────────────────────────────────
async function upload(file,onProg){
  return new Promise((res,rej)=>{
    const fd=new FormData();fd.append('file',file);fd.append('upload_preset',CPRE);
    const isMedia=file.type.startsWith('video/')||file.type.startsWith('audio/');
    const xhr=new XMLHttpRequest();
    xhr.open('POST',`https://api.cloudinary.com/v1_1/${CLD}/${isMedia?'video':'image'}/upload`);
    xhr.upload.onprogress=e=>{if(e.lengthComputable&&onProg)onProg(Math.round(e.loaded*100/e.total));};
    xhr.onload=()=>{const d=JSON.parse(xhr.responseText);d.secure_url?res(d.secure_url):rej(d);};
    xhr.onerror=rej;xhr.send(fd);
  });
}

function showReactionBar(pid){
  const bar=document.getElementById('rbar-'+pid);if(!bar)return;

function updateLikeUI(pid,liked,cnt,reaction){
  const el=document.getElementById('lbtn-'+pid);
  if(el){el.dataset.liked=liked;el.dataset.cnt=cnt;el.dataset.reaction=reaction;el.innerHTML=likeIconHTML(liked,reaction);}
  const lc1=document.getElementById('lcnt-'+pid);
  if(lc1){lc1.textContent=fmt(cnt)+' likes';lc1.style.display=cnt>0?'block':'none';}
  const lc2=document.getElementById('lcnt-'+pid+'-txt');
  if(lc2) lc2.textContent=fmt(cnt);
}

async function toggleLike(pid){
  if(lpFired){lpFired=false;return;}
  const el=document.getElementById('lbtn-'+pid);if(!el)return;
  const wasLiked=el.dataset.liked==='true';
  const newLiked=!wasLiked;
  const cnt=parseInt(el.dataset.cnt)||0;
  const newCnt=newLiked?cnt+1:Math.max(0,cnt-1);
  const owner=el.dataset.owner;
  updateLikeUI(pid,newLiked,newCnt,'heart');
  if(newLiked){
    await db.from('likes').upsert({user_id:ME.id,post_id:pid,reaction:'heart'},{onConflict:'user_id,post_id'});
    if(owner&&owner!==ME.id) db.from('notifications').insert({recipient_id:owner,sender_id:ME.id,type:'like',post_id:pid,message:'liked your post ❤️'}).catch(()=>{});
  }else{
    await db.from('likes').delete().eq('user_id',ME.id).eq('post_id',pid);
  }
}

function dblLike(pid,cont){
  const el=document.getElementById('lbtn-'+pid);
  if(el&&el.dataset.liked!=='true') toggleLike(pid);
  const p=document.createElement('div');p.className='hpop';p.textContent='❤️';
  cont.appendChild(p);setTimeout(()=>p.remove(),700);
}

async function setReaction(e,pid,emoji){
  e.stopPropagation();
  const reactionKey=Object.keys(REACT_MAP).find(k=>REACT_MAP[k]===emoji)||'heart';
  const el=document.getElementById('lbtn-'+pid);if(!el)return;
  const wasLiked=el.dataset.liked==='true';
  const cnt=parseInt(el.dataset.cnt)||0;
  const owner=el.dataset.owner;
  const newCnt=wasLiked?cnt:cnt+1;
  updateLikeUI(pid,true,newCnt,reactionKey);
  await db.from('likes').upsert({user_id:ME.id,post_id:pid,reaction:reactionKey},{onConflict:'user_id,post_id'});
  if(!wasLiked&&owner&&owner!==ME.id) db.from('notifications').insert({recipient_id:owner,sender_id:ME.id,type:'like',post_id:pid,message:`reacted ${emoji} to your post`}).catch(()=>{});
  const bar=document.getElementById('rbar-'+pid);if(bar)bar.style.display='none';
}

async function toggleSave(pid){
  const el=document.getElementById('sbtn-'+pid);if(!el)return;
  const was=el.dataset.saved==='true';

  el.innerHTML=!was?ico('bmf'):ico('bm');

async function delPost(pid){
  if(!confirm('Post delete karo?'))return;
  await db.from('posts').delete().eq('id',pid).eq('user_id',ME.id);

  if(el){el.style.opacity='0';el.style.transition='opacity 0.3s';setTimeout(()=>el.remove(),300);}

}

// ── STORY VIEWER ──────────────────────────────────────
function openSV(idx){
  if(!svData.length)return;
  svIdx=idx;svProg=0;
  document.getElementById('sv').classList.add('show');
  renderSV();
}

function renderSV(){
  const s=svData[svIdx];if(!s){closeSV();return;}
  clearInterval(svTimer);svProg=0;
  document.getElementById('sv-bars').innerHTML=svData.map((_,i)=>`
    <div style="flex:1;height:2.5px;background:rgba(255,255,255,0.25);border-radius:2px">
      <div id="svb-${i}" style="height:100%;background:#fff;border-radius:2px;width:${i<svIdx?'100%':i===svIdx?'0%':'0%'};transition:${i===svIdx?'width 0.1s linear':'none'}"></div>
    </div>`).join('');
  document.getElementById('sv-hdr').innerHTML=`
    <div onclick="closeSV();goToProfile('${s.user_id}')" style="display:flex;align-items:center;gap:10px;cursor:pointer">
      ${av(s.profiles?.avatar_url,s.profiles?.username,38)}
      <div>
        <div style="color:#fff;font-weight:700;font-size:14px">${s.profiles?.username||''}</div>
        <div style="color:rgba(255,255,255,0.6);font-size:11px">${ago(s.created_at)}</div>
      </div>
    </div>
    <div onclick="closeSV()" style="cursor:pointer;padding:4px">${ico('close')}</div>`;
  const med=document.getElementById('sv-media');
  med.innerHTML=s.media_type==='video'
    ?`<video src="${s.media_url}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" autoplay playsinline loop></video>`
    :`<img src="${s.media_url}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`;
  document.getElementById('sv-cap').textContent=s.caption||'';
  document.getElementById('sv-nav').innerHTML=`<div style="flex:1" onclick="${svIdx>0?'prevSV()':'closeSV()'}"></div><div style="flex:1" onclick="nextSV()"></div>`;
  svTimer=setInterval(()=>{
    svProg+=1.4;
    const b=document.getElementById('svb-'+svIdx);
    if(b) b.style.width=svProg+'%';
    if(svProg>=100) nextSV();
  },100);
}
function nextSV(){if(svIdx<svData.length-1){svIdx++;renderSV();}else closeSV();}
function prevSV(){if(svIdx>0){svIdx--;renderSV();}}
function closeSV(){clearInterval(svTimer);pauseAllVideos();document.getElementById('sv').classList.remove('show');}

function prevMedia(inp,type){
  const f=inp.files[0];if(!f)return;
  const url=URL.createObjectURL(f);
  const prev=document.getElementById('mprev');
  prev.innerHTML=f.type.startsWith('video/')?`<video src="${url}" style="width:100%;height:100%;object-fit:cover" muted playsinline autoplay loop></video>`:`<img src="${url}" style="width:100%;height:100%;object-fit:cover">`;
  const btn=document.getElementById('cbtn');btn.disabled=false;btn.style.opacity='1';
}

async function submitCreate(type){
  const f=document.getElementById('fpick')?.files[0];
  if(!f){toast('Pehle media select karo');return;}
  const btn=document.getElementById('cbtn');
  btn.disabled=true;btn.textContent='Uploading...';
  document.getElementById('uprog').style.display='block';
  try{
    const url=await upload(f,p=>{
      document.getElementById('upct').textContent=p+'%';
      document.getElementById('upfill').style.width=p+'%';
    });
    const cap=document.getElementById('capinp')?.value||'';
    const loc=document.getElementById('locinp')?.value||'';
    await db.from('posts').insert({user_id:ME.id,media_url:url,media_type:f.type.startsWith('video/')?'video':'image',is_reel:type==='reel',caption:cap,location:loc});
    toast(type==='story'?'Story posted! 🎉':type==='reel'?'Reel posted! 🔥':'Post shared! ✨');
    closeModal();
    go(type==='reel'?'reels':'home');
  }catch(e){toast('Upload failed. Try again.');btn.disabled=false;btn.textContent='Share';}
}

    h+=`<div style="grid-column:1/-1;padding:12px 16px;font-weight:700;font-size:12px;color:#666;letter-spacing:1px">POSTS (${posts.length})</div>`;
    h+=posts.map(p=>`<div class="eitem" onclick="viewPost('${p.id}')">${p.media_url?`<img src="${p.media_url}" loading="lazy">`:'<div style="display:flex;align-items:center;justify-content:center;font-size:32px;width:100%;height:100%;color:#333">📷</div>'}</div>`).join('');

  g.innerHTML=h||`<div style="grid-column:1/-1;text-align:center;padding:48px;color:#444">"${qq}" ke liye koi result nahi mila 😕</div>`;

function adjustFollowerCount(delta){
  const el=document.getElementById('followers-count');
  if(!el)return;
  const raw=Math.max(0,(parseInt(el.dataset.raw)||0)+delta);
  el.dataset.raw=raw;
  el.textContent=fmt(raw);
}

async function toggleFollowProfile(userId){
  const btn=document.getElementById('follow-btn');if(!btn)return;
  const wasFollowing=btn.textContent.trim()==='Following';
  const newFollowing=!wasFollowing;
  // optimistic UI update — changes instantly, no need to reopen profile
  btn.textContent=newFollowing?'Following':'Follow';
  btn.className=newFollowing?'bout':'bgrd';
  adjustFollowerCount(newFollowing?1:-1);
  try{
    if(newFollowing){
      const{error}=await db.from('follows').insert({follower_id:ME.id,following_id:userId});
      if(error)throw error;
      db.from('notifications').insert({recipient_id:userId,sender_id:ME.id,type:'follow',message:'started following you'}).catch(()=>{});
      toast('Following! 🎉');
    }else{
      await db.from('follows').delete().eq('follower_id',ME.id).eq('following_id',userId);
    }
  }catch(e){
    // Revert UI on actual network failure
    btn.textContent=wasFollowing?'Following':'Follow';
    btn.className=wasFollowing?'bout':'bgrd';
    adjustFollowerCount(wasFollowing?1:-1);
    toast('Network error, try again 😕');
  }
}

  const m=modal(type==='followers'?'Followers':'Following');

  const filterCol=type==='followers'?'following_id':'follower_id';
  const{data:rows}=await db.from('follows').select(col).eq(filterCol,userId);
  const ids=[...new Set((rows||[]).map(r=>r[col]))];
  if(!ids.length){body.innerHTML=`<div style="text-align:center;padding:48px;color:#444">Koi ${type==='followers'?'follower':'following'} nahi abhi</div>`;return;}
  const{data:list}=await db.from('profiles').select('id,username,avatar_url,full_name,is_verified,last_seen').in('id',ids);
  let followingSet=new Set();

  body.innerHTML=(list||[]).map(u=>`

          <div style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px">${u.username}${u.is_verified?ico('verified','',13):''}</div>
          <div style="color:#666;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.full_name||''}</div>
        </div>
      </div>
      ${u.id!==ME.id?`<button class="${followingSet.has(u.id)?'bout':'bgrd'}" style="width:auto;padding:8px 16px;font-size:12px;flex-shrink:0" onclick="quickFollow('${u.id}',this)">${followingSet.has(u.id)?'Following':'Follow'}</button>`:''}
    </div>`).join('');
}

async function quickFollow(userId,btn){
  const wasFollowing=btn.textContent.trim()==='Following';
  btn.textContent=wasFollowing?'Follow':'Following';
  btn.className=wasFollowing?'bgrd':'bout';
  try{
    if(wasFollowing){
      await db.from('follows').delete().eq('follower_id',ME.id).eq('following_id',userId);
    }else{
      const{error}=await db.from('follows').insert({follower_id:ME.id,following_id:userId});
      if(error)throw error;
      db.from('notifications').insert({recipient_id:userId,sender_id:ME.id,type:'follow',message:'started following you'}).catch(()=>{});
    }
  }catch(e){
    btn.textContent=wasFollowing?'Following':'Follow';
    btn.className=wasFollowing?'bout':'bgrd';
    toast('Error, try again 😕');
  }
}

async function renderReels(){
  const scr=document.getElementById('screen');
  const{data:reels}=await db.from('posts').select('*,profiles(username,avatar_url,is_verified)').eq('is_reel',true).order('created_at',{ascending:false}).limit(20);

      <div style="color:#555;font-size:14px">Pehla reel banao!</div>
      <button class="bgrd" onclick="showCreate('reel')" style="width:auto;padding:13px 32px">🎬 New Reel</button>
    </div>`;return;
  }

  const ids=reels.map(r=>r.id);
  const{data:lk}=await db.from('likes').select('post_id,reaction').eq('user_id',ME.id).in('post_id',ids);

  scr.style.overflow='hidden';
  scr.innerHTML=`<div id="rwrap" style="height:100%;position:relative;touch-action:pan-y">
    <div id="rinner" style="height:${reels.length*100}%;transition:transform 0.38s cubic-bezier(0.25,0.46,0.45,0.94)">
      ${reels.map((r,i)=>{
        const liked=likedSet.has(r.id), reaction=reactionMap[r.id]||'heart';
        return `
        <div style="height:${100/reels.length}%;position:relative;background:#000;overflow:hidden">
          ${r.media_url?`<video src="${r.media_url}" class="rvid" id="rv-${i}" ${i===0?'autoplay':''} ${reelsMuted?'muted':''} playsinline loop></video>`:`<div style="position:absolute;inset:0;background:linear-gradient(135deg,#1a0533,#0d1f3c);display:flex;align-items:center;justify-content:center;font-size:90px">🎬</div>`}
          <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.5) 0%,transparent 40%,transparent 70%,rgba(0,0,0,0.3) 100%)"></div>
          <div style="position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center">
            <span style="font-weight:800;font-size:18px;text-shadow:0 2px 8px rgba(0,0,0,0.8)">Reels</span>
            <div onclick="showCreate('reel')" style="cursor:pointer">${ico('cam')}</div>
          </div>
          <div class="mute-btn" onclick="toggleReelsMute()"><span class="mute-icon">${reelsMuted?ico('mute','#fff',20):ico('unmute','#fff',20)}</span></div>
          <div style="position:absolute;right:12px;bottom:110px;display:flex;flex-direction:column;gap:22px;align-items:center">
            <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:5px">
              <div id="lbtn-${r.id}" data-liked="${liked}" data-cnt="${r.likes_count||0}" data-owner="${r.user_id}" data-reaction="${reaction}"
                onclick="toggleLike('${r.id}')" ontouchstart="startLongPress('${r.id}')" ontouchend="cancelLongPress()" ontouchmove="cancelLongPress()" style="cursor:pointer">
                ${likeIconHTML(liked,reaction)}
              </div>
              <span id="lcnt-${r.id}-txt" style="color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,0.8)">${fmt(r.likes_count||0)}</span>
              <div id="rbar-${r.id}" class="reaction-bar" style="bottom:auto;top:0;left:auto;right:46px"></div>
            </div>
            <div onclick="openComments('${r.id}')" style="display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer">
              ${ico('comment')}<span style="color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,0.8)">${fmt(r.comments_count||0)}</span>
            </div>
            <div onclick="shareIt()" style="display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer">
              ${ico('send')}<span style="color:#fff;font-size:12px;font-weight:700">Share</span>
            </div>
          </div>
          <div style="position:absolute;left:14px;right:64px;bottom:80px">
            <div onclick="goToProfile('${r.user_id}')" style="display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer">
              ${av(r.profiles?.avatar_url,r.profiles?.username,40)}
              <span style="font-weight:700;font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,0.9)">${r.profiles?.username||''}</span>
              ${r.profiles?.is_verified?ico('verified','',14):''}
            </div>
            ${r.caption?`<div style="color:rgba(255,255,255,0.92);font-size:14px;line-height:1.5;text-shadow:0 1px 6px rgba(0,0,0,0.9)">${r.caption}</div>`:''}
          </div>
          <div style="position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px">
            ${reels.map((_,j)=>`<div style="width:3px;height:${j===i?18:5}px;border-radius:3px;background:${j===i?'#fff':'rgba(255,255,255,0.3)'};transition:all 0.3s"></div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
  const wrap=document.getElementById('rwrap');
  const inner=document.getElementById('rinner');
  let sy=0;
  wrap.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;},{passive:true});
  wrap.addEventListener('touchend',e=>{
    const d=sy-e.changedTouches[0].clientY;
    const old=ri;
    if(d>60&&ri<reels.length-1)ri++;
    else if(d<-60&&ri>0)ri--;
    else return;
    inner.style.transform=`translateY(-${ri*(100/reels.length)}%)`;
    currentReelIdx=ri;
    const ov=document.getElementById('rv-'+old);if(ov){ov.pause();}
    const v=document.getElementById('rv-'+ri);if(v){v.muted=reelsMuted;v.currentTime=0;v.play().catch(()=>{});}
  },{passive:true});
}

function toggleReelsMute(){
  reelsMuted=!reelsMuted;
  document.querySelectorAll('.rvid').forEach(v=>{
    v.muted=reelsMuted;
    if(!reelsMuted) v.play().catch(()=>{});
  });
  document.querySelectorAll('.mute-icon').forEach(el=>{el.innerHTML=reelsMuted?ico('mute','#fff',20):ico('unmute','#fff',20);});
  toast(reelsMuted?'🔇 Muted':'🔊 Sound On');
}

async function uploadGCAvatar(inp,cid){
  const f=inp.files[0];if(!f)return;
  toast('Uploading...');
  try{const url=await upload(f);await db.from('conversations').update({group_avatar:url}).eq('id',cid);toast('Group photo updated! 🎉');closeModal();openChat(cid,window._chatGcName,true);}
  catch(e){toast('Upload failed');}
}

async function saveGCName(cid,n){
  if(!n?.trim())return;
  await db.from('conversations').update({group_name:n.trim()}).eq('id',cid);
  window._chatGcName=n.trim();toast('Name updated ✨');
}

async function makeAdmin(cid,uid){
  await db.from('conversation_members').update({is_admin:true}).eq('conversation_id',cid).eq('user_id',uid);
  await db.from('messages').insert({conversation_id:cid,sender_id:ME.id,text:'👑 A member was made admin'});
  toast('Admin ban gaya! 👑');closeModal();openChat(cid,window._chatGcName,true);
}

async function removeMember(cid,uid){
  if(!confirm('Remove this member?'))return;
  const uname=window._chatMembers?.find(m=>m.user_id===uid)?.profiles?.username||'Someone';
  await db.from('conversation_members').delete().eq('conversation_id',cid).eq('user_id',uid);
  await db.from('messages').insert({conversation_id:cid,sender_id:ME.id,text:`❌ ${uname} was removed`});
  toast('Removed');closeModal();openChat(cid,window._chatGcName,true);
}

async function leaveGroup(cid){
  if(!confirm('Group chhod doge?'))return;
  await db.from('conversation_members').delete().eq('conversation_id',cid).eq('user_id',ME.id);
  await db.from('messages').insert({conversation_id:cid,sender_id:ME.id,text:`👋 ${PROF.username||'Someone'} left the group`});
  closeModal();go('dms');toast('Group chhod diya');
}

async function searchAddMember(q,cid){
  if(!q.trim())return;
  const exIds=(window._chatMembers||[]).map(m=>m.user_id);
  const filter=exIds.length?`&id=not.in.(${exIds.join(',')})`:'';
  const{data:u}=await db.from('profiles').select('*').ilike('username',`%${q}%`).limit(8);
  const filtered=(u||[]).filter(x=>!exIds.includes(x.id));
  const r=document.getElementById('gc-add-res');if(!r)return;
  r.innerHTML=filtered.map(x=>`
    <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #0d0d0d">
      ${av(x.avatar_url,x.username,40)}
      <div style="flex:1"><div style="font-weight:700;font-size:14px">${x.username}</div><div style="color:#555;font-size:12px">${x.full_name||''}</div></div>
      <button onclick="addToGroup('${cid}','${x.id}','${(x.username||'').replace(/'/g,"\'")}',this)" style="background:${GRAD};border:none;border-radius:8px;color:#fff;font-size:12px;padding:6px 12px;cursor:pointer">Add</button>
    </div>`).join('')||'<div style="color:#444;text-align:center;padding:16px">Koi nahi mila</div>';
}

async function addToGroup(cid,uid,uname,btn){
  try{
    await db.from('conversation_members').insert({conversation_id:cid,user_id:uid,is_admin:false});
    await db.from('messages').insert({conversation_id:cid,sender_id:ME.id,text:`✅ ${uname} was added to the group`});
    toast(`${uname} added! 🎉`);
    btn.textContent='Added ✓';btn.disabled=true;btn.style.opacity='0.5';
    const{data:mems}=await db.from('conversation_members').select('user_id,is_admin,profiles(username,avatar_url,last_seen)').eq('conversation_id',cid);
    window._chatMembers=mems||[];
  }catch(e){toast('Error: '+e.message);}
}

  const{data:msgs}=await db.from('messages').select('*,profiles(username,avatar_url)').eq('conversation_id',cid).order('created_at',{ascending:true}).limit(100);
  const list=document.getElementById('mlist');if(!list)return;
  const isSystem=t=>t&&(t.startsWith('✅')||t.startsWith('❌')||t.startsWith('👑')||t.startsWith('👋'));
  list.innerHTML=(msgs||[]).map(m=>{
    const isMe=m.sender_id===ME.id;
    // System messages (join/leave/add/remove/admin)
    if(isSystem(m.text)) return `<div style="text-align:center;padding:6px 0"><span style="background:#1a1a1a;color:#888;font-size:12px;padding:4px 12px;border-radius:12px">${m.text}</span></div>`;
    const content=m.media_type==='audio'
      ?`<audio controls src="${m.media_url}" style="max-width:200px;height:36px"></audio>`
      :(m.text||'');
    return `<div style="display:flex;justify-content:${isMe?'flex-end':'flex-start'};gap:8px;align-items:flex-end;margin-bottom:2px">

// VOICE MESSAGES
async function toggleRecording(cid){
  const btn=document.getElementById('mic-btn');if(!btn)return;
  if(!recording){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder=new MediaRecorder(stream);
      audioChunks=[];
      mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
      mediaRecorder.onstop=async()=>{
        const blob=new Blob(audioChunks,{type:'audio/webm'});
        if(blob.size<500){toast('Recording too short');stream.getTracks().forEach(t=>t.stop());return;}
        toast('Sending voice message... 🎤');
        try{
          const file=new File([blob],'voice.webm',{type:'audio/webm'});
          const url=await upload(file);
          await db.from('messages').insert({conversation_id:cid,sender_id:ME.id,text:'',media_url:url,media_type:'audio'});
          loadMsgs(cid,window._curIsGrp);
        }catch(e){toast('Voice message failed');}
        stream.getTracks().forEach(t=>t.stop());
      };
      mediaRecorder.start();
      recording=true;
      btn.style.background='#E1306C';
      btn.innerHTML=ico('stop');
      toast('🔴 Recording... tap to stop');
    }catch(e){toast('Microphone permission denied');}
  }else{
    mediaRecorder.stop();
    recording=false;
    btn.style.background='#1a1a1a';
    btn.innerHTML=ico('mic');
  }
}

  try{
    navigator.clipboard.writeText(link);
    toast('Link copied! 📋');
  }catch(e){toast('Could not copy');}
}

// ── MODAL HELPER ──────────────────────────────────────
function modal(title){
  closeModal();
  pauseAllVideos();
  const el=document.createElement('div');
  el.className='mbg';el.id='cmodal';
  el.innerHTML=`<div class="msheet">
    <div class="mhdr">
      <span style="font-weight:700;font-size:16px">${title}</span>
      <div onclick="closeModal()" style="cursor:pointer;padding:4px">${ico('close')}</div>
    </div>
    <div id="mbody"></div>
  </div>`;
  el.onclick=e=>{if(e.target===el)closeModal();};
  document.body.appendChild(el);
  return el;
}
function closeModal(){
  pauseAllVideos();
  const m=document.getElementById('cmodal');if(m)m.remove();
  if(curTab==='reels'){
    const v=document.getElementById('rv-'+currentReelIdx);
    if(v){v.muted=reelsMuted;v.play().catch(()=>{});}
  }
}
</script>
