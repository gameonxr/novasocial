<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>NovaSocial</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#E1306C">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;height:-webkit-fill-available}
body{height:100%;height:-webkit-fill-available;background:#000;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;position:fixed;width:100%}
*::-webkit-scrollbar{display:none}
input,textarea,button{font-family:inherit}
input::placeholder,textarea::placeholder{color:#444}

/* SPLASH */
#splash{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,#14171c 0%,#0a0b0d 45%,#000 100%);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity 0.45s ease}
#splash.hide{opacity:0;pointer-events:none}
.splash-icon-wrap{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.splash-icon{width:96px;height:96px;border-radius:24px;display:block;box-shadow:0 0 30px rgba(0,252,255,0.22),0 0 30px rgba(252,0,124,0.22),0 10px 36px rgba(0,0,0,0.5);position:relative;z-index:2;opacity:0;transform:scale(0.82);animation:splashIconIn 0.6s cubic-bezier(0.22,1,0.36,1) forwards}
.splash-ring{position:absolute;inset:-14px;border-radius:32px;border:1.5px solid rgba(255,255,255,0.35);opacity:0;animation:splashRing 1.8s ease-out 0.55s infinite}
.splash-word{font-size:30px;font-weight:800;letter-spacing:0.3px;opacity:0;transform:translateY(8px);animation:splashWordIn 0.5s ease 0.48s forwards}
.sw-nova{background:linear-gradient(135deg,#ff6fc4,#fc007c,#7a0042);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 10px rgba(252,0,124,0.55))}
.sw-social{background:linear-gradient(135deg,#7afdff,#00fcff,#00626c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 10px rgba(0,252,255,0.55))}
.splash-tag{color:#444;font-size:12px;letter-spacing:2.5px;opacity:0;animation:splashWordIn 0.5s ease 0.72s forwards}
@keyframes splashIconIn{from{opacity:0;transform:scale(0.82) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes splashRing{0%{opacity:0.55;transform:scale(0.92)}70%{opacity:0}100%{opacity:0;transform:scale(1.28)}}
@keyframes splashWordIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* CORE LAYOUT */
#root{display:flex;flex-direction:column;height:100vh;height:-webkit-fill-available;width:100%;position:fixed;top:0;left:0;right:0;bottom:0}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
#nav{height:60px;min-height:60px;background:#000;border-top:1px solid #1a1a1a;display:flex;align-items:center;width:100%;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}

/* NAV BUTTONS */
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;cursor:pointer;position:relative;gap:3px;padding-bottom:4px}
.nb svg{transition:all 0.2s}
.nb .ndot{width:4px;height:4px;border-radius:50%;background:#fff;opacity:0;transition:opacity 0.2s}
.nb.on .ndot{opacity:1}

/* AUTH */
#auth{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:1000;overflow-y:auto}
.alogo{font-size:44px;font-weight:900;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.asub{color:#555;font-size:14px;margin-bottom:40px}
.atabs{display:flex;background:#111;border-radius:14px;padding:4px;width:100%;max-width:400px;margin-bottom:20px}
.atab{flex:1;padding:11px;text-align:center;border-radius:11px;cursor:pointer;font-weight:600;font-size:14px;transition:all 0.2s;color:#555}
.atab.on{background:#1a1a1a;color:#fff}
.aform{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
.inp{width:100%;background:#0f0f0f;border:1px solid #222;border-radius:14px;padding:15px 16px;color:#fff;font-size:15px;outline:none;transition:border 0.2s}
.inp:focus{border-color:#555}
.bgrd{background:linear-gradient(135deg,#833AB4,#E1306C,#F77737);border:none;border-radius:14px;color:#fff;font-weight:700;font-size:15px;cursor:pointer;padding:15px;width:100%;transition:opacity 0.2s}
.bgrd:active{opacity:0.8}
.bout{background:transparent;border:1px solid #2a2a2a;border-radius:14px;color:#fff;font-weight:600;font-size:14px;cursor:pointer;padding:13px;width:100%}
.aerr{color:#E1306C;font-size:13px;text-align:center;padding:4px}

/* TOPBAR */
.topbar{position:sticky;top:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:100;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #111}
.logo{font-size:24px;font-weight:900;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* CARDS */
.post{border-bottom:8px solid #0a0a0a}
.post-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 14px}
.post-media{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.post-acts{padding:10px 14px 8px}

/* AVATAR */
.av{border-radius:50%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.avring{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);padding:2px;border-radius:50%}
.avrinner{border:2px solid #000;border-radius:50%}
.onlinedot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:#3db83d;border:2px solid #000}

/* STORIES */
.sbar{overflow-x:auto;display:flex;gap:16px;padding:14px 16px;border-bottom:1px solid #0d0d0d}
.si{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;cursor:pointer}
.sname{font-size:11px;max-width:64px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#bbb}

/* MODAL */
.mbg{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,0.8);display:flex;flex-direction:column}
.msheet{background:#0d0d0d;border-radius:24px 24px 0 0;margin-top:auto;max-height:94vh;overflow-y:auto;animation:slideUp 0.3s cubic-bezier(0.32,0.72,0,1)}
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #1a1a1a;position:sticky;top:0;background:#0d0d0d;z-index:1}

/* STORY VIEWER */
#sv{position:fixed;inset:0;z-index:9000;background:#000;display:none;flex-direction:column}
#sv.show{display:flex}

/* LOADER */
.ldiv{display:flex;justify-content:center;align-items:center;padding:40px}
.spin{width:28px;height:28px;border-radius:50%;border:2px solid #222;border-top-color:#E1306C;animation:spin 0.7s linear infinite}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a1a1a;color:#fff;font-size:13px;padding:11px 24px;border-radius:24px;z-index:9999;white-space:nowrap;opacity:0;transition:all 0.3s;pointer-events:none;border:1px solid #2a2a2a;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* HEART POP */
.hpop{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;pointer-events:none;z-index:10;animation:heartPop 0.7s ease forwards}

/* REACTION BAR */
.reaction-bar{position:absolute;bottom:100%;left:0;margin-bottom:8px;background:#1a1a1a;border:1px solid #2e2e2e;border-radius:24px;padding:8px 12px;display:none;gap:9px;box-shadow:0 6px 24px rgba(0,0,0,0.55);z-index:60;white-space:nowrap;animation:fadeIn 0.15s ease}
.reaction-bar span{transition:transform 0.15s}
.reaction-bar span:active{transform:scale(1.4)}

/* EXPLORE */
.egrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.eitem{aspect-ratio:1/1;background:#111;overflow:hidden;cursor:pointer;position:relative}
.eitem img,.eitem video{width:100%;height:100%;object-fit:cover}

/* PROFILE */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pitem{aspect-ratio:1/1;background:#111;overflow:hidden;cursor:pointer}
.pitem img{width:100%;height:100%;object-fit:cover}
.pstat{text-align:center;flex:1}
.pstat-n{font-weight:800;font-size:20px;color:#fff}
.pstat-l{color:#777;font-size:12px}

/* MSG */
  .clist{
margin:8px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid rgba(79,142,247,0.4);
  border-radius: 18px;
  background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  backdrop-filter: blur(6px);
  box-shadow:
    inset 0 0 8px rgba(255,255,255,0.08),
    0 6px 14px rgba(0,0,0,0.6),
    0 0 20px rgba(79,142,247,0.3);
  cursor: pointer;
  transition: 0.3s ease;
}

.clist:active {
  background: linear-gradient(145deg, rgba(79,142,247,0.25), rgba(0,224,255,0.15));
  box-shadow:
    inset 0 0 10px rgba(255,255,255,0.15),
    0 0 25px rgba(79,142,247,0.6);
  transform: scale(0.98);
                              }
.mme{background:linear-gradient(135deg,#833AB4,#E1306C);border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:72%;font-size:14px;line-height:1.5;margin-left:auto}
.mthem{background:#1a1a1a;border-radius:18px 18px 18px 4px;padding:10px 14px;max-width:72%;font-size:14px;line-height:1.5}

/* SEARCH */
.sbar2{display:flex;align-items:center;gap:10px;background:#111;border-radius:14px;padding:11px 14px;flex:1}
.sbar2 input{background:transparent;border:none;outline:none;color:#fff;font-size:14px;flex:1}

/* PILLS */
.pills{overflow-x:auto;display:flex;gap:8px;padding:12px 16px 0;scrollbar-width:none}
.pill{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s}

/* UPLOAD BAR */
.upbar{height:4px;background:#222;border-radius:4px;overflow:hidden}
.upfill{height:100%;background:linear-gradient(90deg,#833AB4,#E1306C,#F77737);border-radius:4px;transition:width 0.3s}

/* REEL */
.rvid{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.mute-btn{position:absolute;top:60px;right:14px;z-index:6;background:rgba(0,0,0,0.45);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* NOTIF */
.nitem{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #0d0d0d;cursor:pointer;transition:background 0.15s}
.nitem:active{background:#0d0d0d}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes heartPop{0%{transform:translate(-50%,-50%) scale(0);opacity:1}55%{transform:translate(-50%,-50%) scale(1.5)}100%{transform:translate(-50%,-50%) scale(1.2);opacity:0}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{animation:fadeIn 0.3s ease}

.notif-pill{
background:#111;
color:#aaa;
border:none;
padding:10px 18px;
border-radius:999px;
font-size:14px;
font-weight:700;
cursor:pointer;
transition:.5s;
}
.notif-pill.active{
background:#fff;
color:#000;
}
.notif-pill:active{
transform:scale(.96);
}

.nitem{
transition:.25s;
}

.nitem:active{
background:#111;
}

</style>
</head>

function av(url,name,size=36,ring=false,online=false){
  const l=(name||'?')[0].toUpperCase();
  const inner=url?`<img src="${url}" style="width:100%;height:100%;object-fit:cover">`:`<span style="font-size:${Math.round(size*0.42)}px;font-weight:700;line-height:1">${l}</span>`;
  let html;
  if(ring) html=`<div class="avring"><div class="avrinner"><div class="av" style="width:${size-5}px;height:${size-5}px">${inner}</div></div></div>`;
  else html=`<div class="av" style="width:${size}px;height:${size}px">${inner}</div>`;
  if(online) return `<div style="position:relative;flex-shrink:0">${html}<div class="onlinedot"></div></div>`;
  return html;
}

function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'k':String(n||0)}
function ago(ts){const s=Math.floor((Date.now()-new Date(ts))/1000);if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';}
function isOnline(ts){if(!ts)return false;return (Date.now()-new Date(ts).getTime())<5*60*1000;}

function lastSeenText(ts){

  if(!ts) return '';

  const diff=Math.floor(
    (Date.now()-new Date(ts).getTime())/1000
  );

  if(diff < 60) return 'Active now';

  if(diff < 3600)
    return `Last seen ${Math.floor(diff/60)}m ago`;

  if(diff < 86400)
    return `Last seen ${Math.floor(diff/3600)}h ago`;

  return `Last seen ${Math.floor(diff/86400)}d ago`;
}

async function doAuth(){
  const email=document.getElementById('i-email').value.trim();
  const pass=document.getElementById('i-pass').value;
  const err=document.getElementById('aerr');
  const btn=document.getElementById('abtn');
  if(!email||!pass){showErr('Email aur password daalo');return;}
  btn.textContent='Please wait...';btn.disabled=true;err.style.display='none';
  try{
    if(amode==='login'){
      const{error}=await db.auth.signInWithPassword({email,password:pass});
      if(error) showErr(error.message.includes('Invalid')?'Email ya password galat hai':error.message);
    }else{
      const uname=document.getElementById('i-user').value.trim().toLowerCase().replace(/\s/g,'_');
      const fname=document.getElementById('i-name').value.trim();
      if(!uname){showErr('Username daalo');btn.textContent='Create Account';btn.disabled=false;return;}
      const{data,error}=await db.auth.signUp({email,password:pass,options:{data:{username:uname,full_name:fname}}});
      if(error) showErr(error.message);
      else if(data.user&&!data.session) showErr('✅ Email bheja! Verify karo phir login karo.');
    }
  }catch(e){showErr('Network error. Internet check karo.');}
  btn.textContent=amode==='login'?'Log In':'Create Account';btn.disabled=false;
}

// ── UPLOAD ──────────────────────────────────────
async function upload(file,onProg){
  return new Promise((res,rej)=>{
    const fd=new FormData();fd.append('file',file);fd.append('upload_preset',CPRE);
    const isMedia=file.type.startsWith('video/')||file.type.startsWith('audio/');
    const xhr=new XMLHttpRequest();
    xhr.open('POST',`https://api.cloudinary.com/v1_1/${CLD}/${isMedia?'video':'image'}/upload`);
    xhr.upload.onprogress=e=>{if(e.lengthComputable&&onProg)onProg(Math.round(e.loaded*100/e.total));};
    xhr.onload=()=>{const d=JSON.parse(xhr.responseText);d.secure_url?res(d.secure_url):rej(d);};
    xhr.onerror=rej;xhr.send(fd);
  });
}

async function loadMoreFeedPosts(){

  if(loader) loader.style.display='none';
  if(!posts?.length){

    if(feedOffset===0){
      document.getElementById('feed-list').innerHTML=`
      <div style="text-align:center;padding:60px 20px;color:#444">
        <div style="font-size:52px;margin-bottom:16px">📸</div>

    }

  }
  let likedSet=new Set(),savedSet=new Set(),reactionMap={};
  const ids=posts.map(p=>p.id);
  const[{data:lk},{data:sv}]=await Promise.all([
    db.from('likes').select('post_id,reaction').eq('user_id',ME.id).in('post_id',ids),
    db.from('bookmarks').select('post_id').eq('user_id',ME.id).in('post_id',ids)
  ]);
  (lk||[]).forEach(x=>{likedSet.add(x.post_id);reactionMap[x.post_id]=x.reaction||'heart';});
  (sv||[]).forEach(x=>savedSet.add(x.post_id));
  const list=document.getElementById('feed-list');
  list.insertAdjacentHTML('beforeend',posts.map(p=>postCard(p,likedSet.has(p.id),savedSet.has(p.id),reactionMap[p.id]||'heart')).join(''));

const MAX_VIDEO_LEN=180; // Instagram jaisa: 3 minute hard cap

function showVideoLengthOptions(dur){
  const wrap=document.getElementById('vlenpick'),opts=document.getElementById('vlen-opts');
  if(!wrap||!opts)return;
  const presets=[15,30,60,90,180].filter(s=>s<dur-1);
  let html=presets.map(s=>`<div class="pill vlen-pill" data-s="${s}" onclick="selectVideoLen(${s})" style="background:#1a1a1a;color:#aaa">${s}s</div>`).join('');
  if(dur<=MAX_VIDEO_LEN){
    html+=`<div class="pill vlen-pill" data-s="full" onclick="selectVideoLen('full')" style="background:#fff;color:#000">Full (${Math.round(dur)}s)</div>`;
    window._videoTrimTo=null;
  }else{
    window._videoTrimTo=180;
    toast('Video 3 min se lambi hai — length choose karo ✂️');
  }
  opts.innerHTML=html;
  wrap.style.display=(presets.length||dur>MAX_VIDEO_LEN)?'flex':'none';
  if(dur>MAX_VIDEO_LEN) setTimeout(()=>selectVideoLen(180),0);
}

function selectVideoLen(s){
  window._videoTrimTo=s;
  document.querySelectorAll('.vlen-pill').forEach(p=>{
    const match=(s==='full'&&p.dataset.s==='full')||(p.dataset.s==String(s));
    p.style.background=match?'#fff':'#1a1a1a';p.style.color=match?'#000':'#aaa';
  });
}

function trimVideo(file,seconds){
  return new Promise((resolve,reject)=>{
    const video=document.createElement('video');
    video.src=URL.createObjectURL(file);
    video.muted=false;video.playsInline=true;
    video.onloadedmetadata=async()=>{
      try{
        const canvas=document.createElement('canvas');
        canvas.width=video.videoWidth;canvas.height=video.videoHeight;
        const ctx=canvas.getContext('2d');
        const canvasStream=canvas.captureStream(30);
        try{
          const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
          const src=audioCtx.createMediaElementSource(video);
          const dest=audioCtx.createMediaStreamDestination();
          src.connect(dest);
          const at=dest.stream.getAudioTracks()[0];
          if(at) canvasStream.addTrack(at);
        }catch(e){}
        const recorder=new MediaRecorder(canvasStream,{mimeType:'video/webm;codecs=vp9,opus'});
        const chunks=[];
        recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
        recorder.onstop=()=>resolve(new File([new Blob(chunks,{type:'video/webm'})],'trimmed.webm',{type:'video/webm'}));
        video.currentTime=0;
        await video.play();
        recorder.start();
        let drawing=true;
        (function draw(){if(!drawing)return;ctx.drawImage(video,0,0,canvas.width,canvas.height);requestAnimationFrame(draw);})();
        setTimeout(()=>{drawing=false;video.pause();recorder.stop();},seconds*1000);
      }catch(err){reject(err);}
    };
    video.onerror=reject;
  });
}

async function adjustFollowerCount(delta) {
  const el = document.getElementById('followers-count');
  if (!el) return;
  let raw = parseInt(el.dataset.raw || 0) + delta;
  raw = Math.max(0, raw);
  el.dataset.raw = raw;
  el.textContent = fmt(raw);
}

async function updateMyFollowingCount(delta) {
  const fel = document.getElementById('following-count');
  if (fel) {
    let raw = parseInt(fel.dataset.raw || 0) + delta;
    raw = Math.max(0, raw);
    fel.dataset.raw = raw;
    fel.textContent = fmt(raw);
  }
}

async function toggleFollowProfile(userId) {

  const btn = document.getElementById('follow-btn');
  if (!btn) return;

  const wasFollowing = btn.textContent.trim() === 'Following';
  const newFollowing = !wasFollowing;

  btn.textContent = newFollowing ? 'Following' : 'Follow';
  btn.className = newFollowing ? 'bout' : 'bgrd';

  adjustFollowerCount(newFollowing ? 1 : -1);
  updateMyFollowingCount(newFollowing ? 1 : -1);

  try {

    let error = null;

    if (newFollowing) {

      const res = await db.from('follows').insert({
        follower_id: ME.id,
        following_id: userId
      });

      error = res.error;

      if (!error) {

        await db.from('notifications').insert({
          recipient_id: userId,
          sender_id: ME.id,
          type: 'follow',
          message: `started following you`
        });

      }

    } else {

      const res = await db.from('follows')
        .delete()
        .eq('follower_id', ME.id)
        .eq('following_id', userId);

      error = res.error;

    }

    if (error) throw error;

    await refreshProfileCounts(userId);

    toast(newFollowing ? 'Following! 🎉' : 'Unfollowed');

  } catch (e) {

    console.error(e);

    btn.textContent = wasFollowing ? 'Following' : 'Follow';
    btn.className = wasFollowing ? 'bout' : 'bgrd';

    adjustFollowerCount(wasFollowing ? 1 : -1);
    updateMyFollowingCount(wasFollowing ? 1 : -1);

    toast('Network error');

  }

}

async function refreshProfileCounts(userId) {
  try {
    const [{ data: target }, { data: me }] = await Promise.all([
      db.from('profiles').select('followers_count').eq('id', userId).single(),
      db.from('profiles').select('following_count').eq('id', ME.id).single()
    ]);

    if (target && document.getElementById('followers-count')) {
      const fel = document.getElementById('followers-count');
      fel.dataset.raw = target.followers_count || 0;
      fel.textContent = fmt(target.followers_count || 0);
    }

    if (me && document.getElementById('following-count')) {
      const myFel = document.getElementById('following-count');
      myFel.dataset.raw = me.following_count || 0;
      myFel.textContent = fmt(me.following_count || 0);
    }
  } catch (e) {
    console.log("Count refresh skipped");
  }
}

async function quickFollow(userId, btn) {

  const wasFollowing = btn.textContent.trim() === 'Following';
  const newFollowing = !wasFollowing;

  btn.textContent = newFollowing ? 'Following' : 'Follow';
  btn.className = newFollowing ? 'bout' : 'bgrd';

  try {

    let error = null;

      const res = await db.from('follows').insert({
        follower_id: ME.id,

      });

async function searchMessages(cid){

  const q = prompt("Search messages");

  if(!q) return;

  const {data:msgs,error} = await db
    .from('messages')
    .select('*')
    .eq('conversation_id',cid)
    .ilike('text',`%${q}%`)
    .order('created_at',{ascending:false})
    .limit(50);

  if(error){
    toast("Search failed");
    return;
  }

  if(!msgs?.length){
    toast("No messages found");
    return;
  }

  const m = modal(`Results (${msgs.length})`);

  m.querySelector('#mbody').innerHTML =
    msgs.map(x=>`
  <div
    onclick="jumpToMessage('${x.id}')"
    style="
    padding:10px;
    border-bottom:1px solid #222;
    cursor:pointer">
        <div style="color:#fff">${x.text||'[media]'}</div>
        <div style="color:#666;font-size:11px">
          ${ago(x.created_at)}
        </div>
      </div>
    `).join('');
}

function jumpToMessage(mid){

  const el=document.querySelector(
    `[data-msgid="${mid}"]`
  );

  if(!el){
    toast("Message not loaded");
    return;
  }

  el.scrollIntoView({
    behavior:'smooth',
    block:'center'
  });

  el.style.transition='0.3s';
  el.style.background='rgba(225,48,108,0.25)';

  setTimeout(()=>{
    el.style.background='';
  },2000);

  document.querySelector('.modal')?.remove();
}

  .from('messages')
.select(`
  *,
  profiles(username,avatar_url),
  replied:reply_to(text)
`)
  .eq('conversation_id',cid)
  .order('created_at',{ascending:true})
  .limit(400);
  
  const {data:reacts}=await db
.from('message_reactions')
.select('*')
.in(
  'message_id',
  (msgs||[]).map(x=>x.id)
);

const reactionMap={};

(reacts||[]).forEach(r=>{
  if(!reactionMap[r.message_id]){
    reactionMap[r.message_id]=[];
  }
  reactionMap[r.message_id].push(r.emoji);
});
  const isSystem=t=>t&&(t.startsWith('✅')||t.startsWith('❌')||t.startsWith('👑')||t.startsWith('👋'));

    const content =
  m.deleted
    ? `<i style="color:#888">This message was unsent</i>`
    : m.media_type==='audio'
      ? `<audio controls src="${m.media_url}" style="max-width:200px;height:36px"></audio>`
      : (m.text||'');
      console.log("MSG =",m);
    return `<div style="display:flex;justify-content:${isMe?'flex-end':'flex-start'};gap:8px;align-items:flex-end;margin-bottom:2px">
      ${!isMe?`<div onclick="goToProfile('${m.sender_id}')" style="cursor:pointer;flex-shrink:0">${av(m.profiles?.avatar_url,m.profiles?.username,28)}</div>`:''}
      <div class="${isMe?'mme':'mthem'}"
      data-msgid="${m.id}"
     style="max-width:72%"
     oncontextmenu="event.preventDefault();showMsgMenu(event,'${m.id}','${(m.text||'').replace(/'/g,'\\\'')}',${isMe})"ondblclick="heartReact('${m.id}')">
        ${isGrp&&!isMe?`<div onclick="goToProfile('${m.sender_id}')" style="color:#E1306C;font-size:11px;font-weight:700;margin-bottom:4px;cursor:pointer">${m.profiles?.username}</div>`:''}
        ${m.replied?.text ? `
<div style="
  border-left:3px solid #E1306C;
  padding-left:8px;
  margin-bottom:6px;
  font-size:12px;
  color:#bbb;
  opacity:.9">
  ${m.replied.text}
</div>
` : ''}
        ${content}
        
        ${reactionMap[m.id]?.length ? `
<div style="
margin-top:6px;
font-size:16px;
display:flex;
gap:4px;
flex-wrap:wrap;">
${reactionMap[m.id].join(' ')}
</div>
` : ''}
        
        <div style="font-size:10px;margin-top:3px;text-align:right">
  <span style="color:rgba(255,255,255,0.3)">
    ${ago(m.created_at)}
  </span>
  ${
    isMe
      ? m.seen_at
        ? '<span style="color:#4FC3F7"> ✓✓</span>'
        : '<span style="color:rgba(255,255,255,0.4)"> ✓</span>'
      : ''
  }
</div>
      </div>
    </div>`;
  }).join('')||'<div style="text-align:center;color:#333;padding:40px;font-size:14px">Baat shuru karo! 👋</div>';
  list.scrollTop=list.scrollHeight;
  // Pause any videos that crept in
  setTimeout(()=>initVideoObserver(),300);
}

async function heartReact(mid){

  const {data:old} = await db
    .from('message_reactions')
    .select('*')
    .eq('message_id',mid)
    .eq('user_id',ME.id)
    .maybeSingle();

  if(old){

    await db
      .from('message_reactions')
      .delete()
      .eq('id',old.id);

    loadMsgs(window._curChatId,window._curIsGrp);
    return;
  }

  await db
    .from('message_reactions')
    .insert({
      message_id:mid,
      user_id:ME.id,
      emoji:'❤️'
    });

  loadMsgs(window._curChatId,window._curIsGrp);
}

async function reactMsg(mid,emoji){

  const {data:old} = await db
    .from('message_reactions')
    .select('*')
    .eq('message_id',mid)
    .eq('user_id',ME.id)
    .maybeSingle();

  if(old){

    if(old.emoji === emoji){

      await db
        .from('message_reactions')
        .delete()
        .eq('id',old.id);

    }else{

      await db
        .from('message_reactions')
        .update({emoji})
        .eq('id',old.id);

    }

  }else{

    await db
      .from('message_reactions')
      .insert({
        message_id:mid,
        user_id:ME.id,
        emoji
      });

  }

  loadMsgs(window._curChatId,window._curIsGrp);

  const box=document.getElementById('react-box');
  if(box) box.remove();
}

async function setTyping(cid,isTyping){

  await db
  .from('profiles')
  .update({
    typing_in:isTyping ? cid : null
  })
  .eq('id',ME.id);

}

function startTypingWatcher(cid){

  const inp=document.getElementById('minp');

  if(inp){

    let typingTimer;

    inp.addEventListener('input',()=>{

      setTyping(cid,true);

      clearTimeout(typingTimer);

      typingTimer=setTimeout(()=>{
        setTyping(cid,false);
      },1500);

    });

  }

  if(window.typingSub){
    db.removeChannel(window.typingSub);
  }

  window.typingSub=db
  .channel('typing-'+cid)
  .on(
    'postgres_changes',
    {
      event:'UPDATE',
      schema:'public',
      table:'profiles'
    },
    (payload)=>{

      if(payload.new.id===ME.id) return;

      const box=document.getElementById('typing-indicator');

      if(!box) return;

      if(payload.new.typing_in===cid){

        box.style.display='block';
        box.textContent=
        payload.new.username + ' is typing...';

      }else{

        box.style.display='none';

      }

    }
  )
  .subscribe();

}

function replyMsg(id,text){

  window.replyToId=id;
  window.replyToText=text;

  const box=document.getElementById('reply-preview');

  if(!box) return;

  box.style.display='block';

  box.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:12px;color:#E1306C">
          Replying to
        </div>

        <div style="font-size:13px;color:#fff">
          ${text||''}

// VOICE MESSAGES
async function toggleRecording(cid){
  const btn=document.getElementById('mic-btn');if(!btn)return;
  if(!recording){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder=new MediaRecorder(stream);
      audioChunks=[];
      mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
      mediaRecorder.onstop=async()=>{
        const blob=new Blob(audioChunks,{type:'audio/webm'});
        if(blob.size<500){toast('Recording too short');stream.getTracks().forEach(t=>t.stop());return;}
        toast('Sending voice message... 🎤');
        try{
          const file=new File([blob],'voice.webm',{type:'audio/webm'});
          const url=await upload(file);
          await db.from('messages').insert({conversation_id:cid,sender_id:ME.id,text:'',media_url:url,media_type:'audio'});
          loadMsgs(cid,window._curIsGrp);
        }catch(e){toast('Voice message failed');}
        stream.getTracks().forEach(t=>t.stop());
      };
      mediaRecorder.start();
      recording=true;
      btn.style.background='#E1306C';
      btn.innerHTML=ico('stop');
      toast('🔴 Recording... tap to stop');
    }catch(e){toast('Microphone permission denied');}
  }else{
    mediaRecorder.stop();
    recording=false;
    btn.style.background='#1a1a1a';
    btn.innerHTML=ico('mic');
  }
}
